services:
  gateway:
    build:
      context: .
      dockerfile: src/Gateway/Gateway.Api/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - core-service
      - users-service

  core-service:
    build:
      context: .
      dockerfile: src/CoreService/CoreService.Api/Dockerfile
    depends_on:
      - core-db
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__CoreDb=Host=core-db;Port=5432;Database=coredb;Username=postgres;Password=postgres
      - UsersService__BaseUrl=http://users-service:8080
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=guest
      - RabbitMQ__Password=guest
    ports:
      - "5001:8080"

  users-service:
    build:
      context: .
      dockerfile: src/UsersService/UsersService.Api/Dockerfile
    depends_on:
      - users-db
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__UsersDb=Host=users-db;Port=5432;Database=usersdb;Username=postgres;Password=postgres
    ports:
      - "5002:8080"

  notification-service:
    build:
      context: .
      dockerfile: src/NotificationService/NotificationService.Api/Dockerfile
    depends_on:
      - notification-db
      - rabbitmq
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__NotificationsDb: Host=notification-db;Port=5432;Database=notificationsdb;Username=postgres;Password=postgres
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Username: guest
      RabbitMQ__Password: guest
    ports:
      - "5003:8080"

  core-db:
    image: postgres:17
    environment:
      POSTGRES_DB: coredb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"

  users-db:
    image: postgres:17
    environment:
      POSTGRES_DB: usersdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
        
  notification-db:
    image: postgres:17
    environment:
      POSTGRES_DB: notificationsdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
        
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
