services:
  gateway:
    build:
      context: .
      dockerfile: src/Gateway/Gateway.Api/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - core-service
      - users-service

  core-service:
    build:
      context: .
      dockerfile: src/CoreService/CoreService.Api/Dockerfile
    depends_on:
      - core-db
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__CoreDb=Host=core-db;Port=5432;Database=coredb;Username=postgres;Password=postgres
      - UsersService__BaseUrl=http://users-service:8080
    ports:
      - "5001:8080"

  users-service:
    build:
      context: .
      dockerfile: src/UsersService/UsersService.Api/Dockerfile
    depends_on:
      - users-db
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__UsersDb=Host=users-db;Port=5432;Database=usersdb;Username=postgres;Password=postgres
    ports:
      - "5002:8080"

  core-db:
    image: postgres:17
    environment:
      POSTGRES_DB: coredb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"

  users-db:
    image: postgres:17
    environment:
      POSTGRES_DB: usersdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"