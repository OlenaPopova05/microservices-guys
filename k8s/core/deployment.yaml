apiVersion: apps/v1
kind: Deployment
metadata:
  name: core-service
spec:
  replicas: 1
  selector: 
    matchLabels:
      app: core-service
  template:
    metadata:
      labels:
        app: core-service
    spec:
      containers:
        - name: core-service
          image: core-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080

          env:
            - name: ASPNETCORE_URLS
              valueFrom:
                configMapKeyRef:
                  name: core-service-config
                  key: ASPNETCORE_URLS
            - name: ConnectionStrings__CoreDb
              valueFrom:
                secretKeyRef:
                  name: core-service-secret
                  key: ConnectionStrings__CoreDb
            - name: RabbitMQ__Host
              value: rabbitmq
            - name: RabbitMQ__Username
              value: guest
            - name: RabbitMQ__Password
              value: guest
                  
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            failureThreshold: 30
            periodSeconds: 5

          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"